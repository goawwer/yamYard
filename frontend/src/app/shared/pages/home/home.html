<section class="hero">
    <div class="hero__content">
        <div class="hero__text">
            <h1>Добро пожаловать</h1>
            <p>
                Находи и делись домашними рецептами со всеми!
                От простых перекусов до серьезных семейных традиций - для всего найдется место.
            </p>
            <div class="hero__actions">
                <button class="btn-primary" [routerLink]="['/auth', 'register']">Присоединиться</button>
                <button class="btn-secondary" [routerLink]="['/info']">Ознакомиться</button>
            </div>
        </div>

        <div class="hero__image">
            <img src="/yamYardMain.png" alt="Cooking together" />
        </div>
    </div>
</section>

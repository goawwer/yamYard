services:
  db:
    image: postgres:16
    container_name: yamyard_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: 
      - "${DB_PORT}:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
  
volumes:
  pgdata:
